<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern social media platform to connect, share, and engage with friends.">
  <title>Nexus — Social Media Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="#/" class="navbar-brand" id="nav-brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="13" stroke="url(#brandGrad)" stroke-width="2"/>
            <circle cx="10" cy="11" r="3" fill="url(#brandGrad)"/>
            <circle cx="18" cy="11" r="3" fill="url(#brandGrad)"/>
            <circle cx="14" cy="18" r="3" fill="url(#brandGrad)"/>
            <line x1="10" y1="11" x2="18" y2="11" stroke="url(#brandGrad)" stroke-width="1.5"/>
            <line x1="10" y1="11" x2="14" y2="18" stroke="url(#brandGrad)" stroke-width="1.5"/>
            <line x1="18" y1="11" x2="14" y2="18" stroke="url(#brandGrad)" stroke-width="1.5"/>
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="28" y2="28">
                <stop offset="0%" stop-color="#7c3aed"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="brand-text">Nexus</span>
      </a>

      <div class="navbar-links" id="nav-links">
        <a href="#/feed" class="nav-link" id="nav-feed" data-tooltip="Feed">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Feed</span>
        </a>
        <a href="#/explore" class="nav-link" id="nav-explore" data-tooltip="Explore">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <span>Explore</span>
        </a>
        <a href="#/profile" class="nav-link" id="nav-profile" data-tooltip="Profile">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Profile</span>
        </a>
      </div>

      <div class="navbar-actions" id="nav-actions">
        <button class="btn btn-ghost nav-logout-btn" id="nav-logout-btn" title="Logout">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="main-content" id="main-content">
    <!-- Views will be rendered here by the JS router -->
    <div class="loading-screen" id="loading-screen">
      <div class="loading-spinner"></div>
      <p>Loading Nexus...</p>
    </div>
  </main>

  <!-- Compose Post Modal -->
  <div class="modal-overlay" id="compose-modal">
    <div class="modal glass-card">
      <div class="modal-header">
        <h3>Create Post</h3>
        <button class="modal-close" id="compose-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <textarea class="compose-textarea" id="compose-textarea" placeholder="What's on your mind?" maxlength="500"></textarea>
        <div class="compose-footer">
          <span class="char-count" id="compose-char-count">0/500</span>
          <button class="btn btn-primary" id="compose-submit-btn">Post</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="edit-profile-modal">
    <div class="modal glass-card">
      <div class="modal-header">
        <h3>Edit Profile</h3>
        <button class="modal-close" id="edit-profile-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="edit-display-name">Display Name</label>
          <input type="text" class="form-input" id="edit-display-name" maxlength="50">
        </div>
        <div class="form-group">
          <label for="edit-bio">Bio</label>
          <textarea class="form-input" id="edit-bio" maxlength="200" rows="3"></textarea>
        </div>
        <div class="compose-footer">
          <button class="btn btn-secondary" id="edit-profile-cancel">Cancel</button>
          <button class="btn btn-primary" id="edit-profile-save">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Action Button -->
  <button class="fab" id="fab-compose" title="Create new post">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/views/auth.js"></script>
  <script src="/js/views/feed.js"></script>
  <script src="/js/views/profile.js"></script>
  <script src="/js/views/explore.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
